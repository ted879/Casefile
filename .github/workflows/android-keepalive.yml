name: Build Wireless Debug KeepAlive APK

on:
  push:
    branches:
      - "claude/wireless-debug-keepalive-app-**"
    paths:
      - "android/wireless-debug-keepalive/**"
      - ".github/workflows/android-keepalive.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: android/wireless-debug-keepalive

jobs:
  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # gradle-wrapper.jar is binary and is not committed; regenerate it so the
      # checked-in gradlew works exactly as it does on a developer machine.
      - name: Restore the Gradle wrapper jar
        run: gradle --no-daemon wrapper --gradle-version 8.14.3

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Report APK details
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          echo "sha256: $(sha256sum "$APK" | cut -d' ' -f1)"
          "$ANDROID_HOME"/build-tools/36.0.0/aapt2 dump badging "$APK" | head -20 || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wireless-debug-keepalive-debug-apk
          path: android/wireless-debug-keepalive/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: android/wireless-debug-keepalive/app/build/reports/tests/
          if-no-files-found: ignore
